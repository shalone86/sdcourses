status: reviewed
course: byzantine-catholic-basics
number: 2
slug: what-does-byzantine-mean
title: What Does “Byzantine” Mean?
excerpt: >-
  A Greek city named for its founder, an emperor's new capital, a Church
  whose worship spread to the Slavs, and a split that Byzantine Catholics
  live across.

