status: draft
course: byzantine-catholic-basics
number: 3
slug: inside-a-byzantine-church
title: Inside a Byzantine Church
excerpt: >-
  Why there is a wall of icons before the altar, what the Royal Doors mean,
  and why Communion is given with a spoon.

sources:
  - id: ugcc
    label: "Christ – Our Pascha: Catechism of the Ukrainian Catholic Church, 600–604, 646"
    file: sources-local/ugcc-catechism.txt
  - id: ccc-images
    label: Catechism of the Catholic Church, 1159–1162
    url: https://www.vatican.va/archive/ENG0015/__P38.HTM
  - id: isaiah-6
    label: Isaiah 6:1–8 (NABRE)
    url: https://bible.usccb.org/bible/isaiah/6
