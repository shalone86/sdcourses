# Kids version of byzantine-catholic-basics/02: the same sources, shorter
# quotations, simpler words, about half as long (explanations ~35 words).
status: draft
course: byzantine-rite-for-kids
number: 2
slug: what-does-byzantine-mean-for-kids
title: What Does Byzantine Mean?
excerpt: >-
  A city named for its founder, an emperor's new capital, and a way of
  praying that spread across the world, for kids.

sources:
  - id: ce-constantinople
    label: "Catholic Encyclopedia (1908): Constantinople"
    url: https://www.newadvent.org/cathen/04301a.htm
  - id: ce-byzantine-rite
    label: "Catholic Encyclopedia (1908): The Rite of Constantinople"
    url: https://www.newadvent.org/cathen/04312d.htm
  - id: ugcc
    label: "Christ – Our Pascha: Catechism of the Ukrainian Catholic Church, 307"
    file: sources-local/ugcc-catechism.txt
  - id: ccc-church
    label: Catechism of the Catholic Church, 838
    url: https://www.vatican.va/archive/ENG0015/__P29.HTM

intro:
  text: >-
    Byzantium, Constantinople, Istanbul...what do these 3 names have in
    common? Well, these are all names of one city, and the word Byzantine
    comes from this city. Not only that, but Byzantine Rite Catholics get
    their traditions from here too. Let's explore more with this lesson. I'm
    your host, Shalone Cason, and let's begin in the name of the Father and of
    the Son and of the Holy Spirit.
  notes:
    - Kids version of lesson 2 of The Byzantine Rite. Aim for about 40–50 words.
    - "A question to open with: Byzantium, Constantinople, Istanbul. One city, three names! And \"Byzantine\" comes from the first one."
    - Byzantine Catholics live all over the world; many in America came from the Carpathian Mountains (Ruthenians) and from Ukraine.
    - "Keep the usual opening: \"I'm your host Shalone Cason\" (your photo) and \"in the name of the Father and of the Son and of the Holy Spirit\" (the Trinity picture)."
  scenes:
    - type: title
    - type: timeline
      items:
        - year: Byzantium
          label: ""
        - year: Constantinople
          label: ""
        - year: Istanbul
          label: ""
    - type: host         # your photo and name, when you say "I'm your host"
      at: I'm your host
    - type: trinity      # triangle (Father), cross (Son), dove (Holy Spirit)
      at: in the name of the Father
      cues: {son: the Son, spirit: the Holy Spirit}

points:
  - heading: A city named for Byzas
    quote:
      lead: A long time ago, a leader named Byzas founded a city, and it took his name.
      text: >-
        Byzas, after whom the city was naturally called Byzantion
      source: ce-constantinople
      cite: Catholic Encyclopedia, "Constantinople"
      highlight: Byzas
    text: >-
      Byzantion, or Byzantium, was a Greek city on a narrow strait where
      Europe meets Asia. It was the city of Byzas. So when we say "Byzantine,"
      we mean "from Byzantium."
    visuals:
      - type: term
        term: Byzantium
        origin: Greek Byzantion
        meaning: the city of Byzas
      - type: map
        region: mediterranean
        places:
          - Byzantium
        highlight: Byzantium
    quiz:
      type: choice
      question: Where does the word "Byzantine" come from?
      options:
        - A king named Peter
        - The city of Byzantium, named for Byzas
        - A kind of bread
      answer: 1
      why: >-
        The city was "naturally called Byzantion" after Byzas, its founder.

  - heading: Constantine's new capital
    quote:
      lead: Emperor Constantine, the first Christian emperor, chose Byzantium for his new capital.
      text: >-
        the solemn inauguration of the new city did not occur until 11 May,
        330
      source: ce-constantinople
      cite: Catholic Encyclopedia, "Constantinople"
      highlight: 11 May, 330
    text: >-
      Constantine gave the city a new name: Constantinople, which means the
      city of Constantine! It was also called a "New Rome." Its great church
      was Hagia Sophia, which means Holy Wisdom. So Byzantium became
      Constantinople.
    visuals:
      - type: image
        src: images/wikimedia-constantine-the-great-label-qs-lit-l-imp-148609.jpg
        aspect: 0.777
        credit: Byzantine mosaicist, ca. 1000 · Wikimedia Commons · Public domain
        with: side
      - type: sprite
        sprite: constantine
        size: full
      - type: map
        region: mediterranean
        places: [Rome, {name: Constantinople, label: above}]
        routes: [[Rome, Constantinople]]
        highlight: Constantinople
        caption: From Old Rome to New Rome
      - type: image
        src: images/wikimedia-hagia-sophia-february-2013-02-25214386.jpg
        aspect: 1.498
        credit: Arild Vågen · Wikimedia Commons · CC BY-SA 3.0
    quiz:
      type: blank
      question: Byzantium was renamed ____, after Emperor Constantine.
      accept: [Constantinople]
      why: >-
        Constantine made it his capital, and the city took his name:
        Constantinople.

  - heading: A way of praying that spread
    quote:
      lead: >-
        The way Constantinople prayed spread far beyond the city. The
        Byzantine Rite was...
      text: >-
        by far the most widely spread in the world.
      source: ce-byzantine-rite
      cite: Catholic Encyclopedia, "The Rite of Constantinople"
      highlight: most widely spread
    text: >-
      This means that this way of praying spread all over. Missionaries
      carried the Gospel from Constantinople to many peoples, like the Slavs
      in Kyiv. Greeks, Slavs, Arabs, and others all prayed this same way. So
      "Byzantine" means a way of praying!
    visuals:
      - type: map
        region: east
        places: [{name: Constantinople, label: below}, {name: Kyiv, label: above}, Antioch]
        routes: [[Constantinople, Kyiv]]
        highlight: Kyiv
        caption: The Byzantine way of praying reaches Kyiv, 988
    quiz:
      type: truefalse
      question: '"Byzantine" is a way of praying that many different peoples share.'
      answer: true
      why: >-
        True! Greeks, Slavs, Arabs and others pray the Byzantine liturgy,
        which spread from Constantinople.

  - heading: Still with the Pope
    quote:
      lead: >-
        A Byzantine catechism tells how the Church of Kyiv stayed close to the
        Church of Rome. Kyiv
      text: >-
        remained in communion with the Church of Rome
      source: ugcc
      cite: Christ – Our Pascha 307
      highlight: communion with the Church of Rome
    text: >-
      Over the years, Rome and Constantinople drifted apart. But the Church of
      Kyiv kept its Byzantine prayers and stayed united with Rome. Byzantine
      Catholics get their history and traditions from Constantinople and Kyiv.
    visuals:
      - type: timeline
        items:
          - { year: "988", label: Baptism of Kyiv }
          - { year: "1054", label: Rome and Constantinople break }
          - { year: "1596", label: Union of Brest }
    quiz:
      type: choice
      question: What did Byzantine Catholics keep?
      options:
        - Their Byzantine prayers, and unity with Rome
        - Only the Roman Rite
        - Neither one
      answer: 0
      why: >-
        They kept their Byzantine way of praying and stayed in communion with
        the Church of Rome.

  - heading: Close to the Orthodox
    quote:
      lead: >-
        The Catechism says Catholics and the Orthodox are very close. The
        Orthodox community...
      text: >-
        lacks little to attain the fullness
      source: ccc-church
      cite: Catechism 838
      highlight: lacks little
    text: >-
      This means that it wouldn't take much for our churches, Catholic and
      Orthodox, to reunite. That's because Orthodox Christians pray the same
      Byzantine liturgy, with the same icons and feasts. The difference is
      unity with the Pope. Even though we are so close, it will be hard for
      everyone to agree, soWe pray that one day we'll all be together again!
    visuals:
      - type: sprite
        sprite: pope-francis
        size: full
      - type: sprite
        sprite: patriarch
        size: full
        with: side
      - type: image
        src: images/sdcason-byzantine-catholic-great-and-holy-wednes-000112643f.jpg
        aspect: 2.162
        credit: The Free Catholic Gallery · The Free Catholic Gallery (sdcason.com) · Public domain (per the gallery)
        fit: cover
      - type: union
        center: The Catholic Church
        items:
          - Roman Catholics
          - Eastern Catholics
          - Eastern Orthodox?
          - Oriental Orthodox?
          - Church of the East?
        caption: Hopefully we can all be united in the future!
    quiz:
      type: truefalse
      question: Byzantine Catholics and Orthodox Christians pray the same Byzantine liturgy.
      answer: true
      why: >-
        True! The difference is unity with the Pope. The Catechism says our
        communion "lacks little to attain the fullness" (CCC 838).

outro:
  text: >-
    So what does Byzantine mean? It was the name of a city that became
    Constantinople, the capital of the Roman Empire. It also became the name
    of the way people from that city prayed, and even though Orthodox and
    eastern catholics both share the Byzantine tradition, only the Eastern
    Catholics are in full communion with the Pope. Thanks for learning with
    us, and until next time, stay holy my friend
  notes:
    - "Recap: a city named for Byzas · Constantine's new capital · a way of praying that spread · still with the Pope · close to the Orthodox."
    - "Next lesson: Inside a Byzantine Church."
    - Aim for about 40–50 words, ending with your usual sign-off.
  scenes:
    - type: recap
