intro:
  text: >-
    A conclave happened about a year ago. Do you know what that is? Who votes
    in a conclave, and how were Pope Francis and Pope Leo XIV elected? Let's
    find out with this lesson. I'm your host, Shalone Cason, and let's begin
    in the name of the Father and of the Son and of the Holy Spirit.
  notes:
    - "A question to open with: a conclave just happened. How did the cardinals choose Pope Leo XIV, and how did popes get chosen before?"
    - "Current rules: Pope John Paul II's 1996 constitution Universi Dominici Gregis (UDG), with later changes by Benedict XVI. The text on vatican.va is the updated one."
    - "Five points: who votes, the two-thirds rule, accepting the office, Pope Francis in 2013, Pope Leo XIV in 2025."
    - "Leo XIV was elected 8 May 2025 on the fourth ballot (Vatican News says so; the Vatican biography gives the dates). Cardinal Dominique Mamberti announced \"Habemus Papam\" from the loggia."
    - "I have not confirmed an official count of electors in a Vatican source. Press reports say 133 cardinals voted; say it only if you check it."
  scenes:
    - type: title
    - type: host
      at: I'm your host
    - type: trinity
      at: in the name of the Father
      cues: {son: the Son, spirit: the Holy Spirit}

points:
  - heading: The cardinals vote
    quote:
      lead: Today's rules say who elects the pope.
      text: >-
        The right to elect the Roman Pontiff belongs exclusively to the
        Cardinals of Holy Roman Church, with the exception of those who have
        reached their eightieth birthday
      source: udg
      cite: Universi Dominici Gregis 33
      highlight: exclusively to the Cardinals
    text: >-
      Only cardinals vote, and only those under eighty. The same rule limits
      the electors to one hundred and twenty, and it excludes any lay power
      from the choice. This was not always so. The Catholic Encyclopedia says
      historians generally hold that early on the clergy and people of Rome
      chose their bishop, as in other dioceses. In 1059 the cardinals were
      given the central role, and they have kept it.
    visuals:
      - type: timeline
        items:
          - { year: "Early Church", label: Clergy and people of Rome }
          - { year: "1059", label: Cardinals take the lead }
          - { year: "Today", label: Cardinals under 80 vote }
      - type: sprite
        sprite: cardinal-walk
        move: across
        size: small
        with: over
    quiz:
      type: choice
      question: Who can vote for the pope today?
      options:
        - Cardinals who have not reached eighty
        - Every bishop in the world
        - The Roman emperor
      answer: 0
      why: >-
        Universi Dominici Gregis 33: the right belongs "exclusively to the
        Cardinals," except those who have reached their eightieth birthday.

  - heading: Two thirds of the votes
    quote:
      lead: A new pope needs a large majority, as the constitution says.
      text: >-
        for the valid election of the Roman Pontiff at least two thirds of the
        votes are required
      source: udg
      cite: Universi Dominici Gregis 62
      highlight: at least two thirds
    text: >-
      The cardinals vote in secret on paper ballots in the Sistine Chapel.
      After each count the ballots are burned, and the smoke tells the crowd
      outside: black means no pope yet, white means there is one. The
      two-thirds rule is old. A Lateran Council set it in 1179. The first
      conclave, which means "with a key," came in 1274 so that the cardinals
      could choose without outside pressure.
    visuals:
      - type: compare
        left: { kicker: No pope yet, title: Black smoke, note: No one has two thirds, icon: cloud }
        right: { kicker: A pope is elected, title: White smoke, note: Two thirds reached, icon: flame }
        emphasis: right
      - type: image
        src: images/wikimedia-c-nclave-papal-en-la-capilla-sixtina-190-164857087.jpg
        aspect: 0.721
      - type: image
        src: images/wikimedia-koncil-5501359.jpg
        aspect: 2.073
        credit: Matthew Paris · Wikimedia Commons · Public domain
    quiz:
      type: blank
      question: A new pope needs at least ____ of the votes.
      accept: [two thirds, two-thirds, 2/3]
      why: >-
        Universi Dominici Gregis 62: "at least two thirds of the votes are
        required."

  - heading: "Yes, and a new name"
    quote:
      lead: >-
        After the vote, the one elected is asked if he accepts. Then he
        becomes pope at once and he
      text: >-
        is immediately Bishop of the Church of Rome, true Pope and Head of the
        College of Bishops
      source: udg
      cite: Universi Dominici Gregis 88
      highlight: immediately Bishop of the Church of Rome
    text: >-
      The Cardinal Dean asks the one elected, "Do you accept your canonical
      election as Supreme Pontiff?" If he says yes, he is asked, "By what name
      do you wish to be called?" From that moment he is pope. No emperor or
      king needs to confirm him, which, in the past, was a serious issue. The
      Church teaches that the pope's authority comes from Christ.
    visuals:
      - type: chain
        items:
          - Elected
          - Do you accept?
          - Chooses a name
          - Is pope
      - type: image
        src: images/wikimedia-charlemagne-and-pope-adrian-i-263647.jpg
        aspect: 1.343
    quiz:
      type: truefalse
      question: A newly elected pope must wait for an emperor or king to confirm him.
      answer: false
      why: >-
        False. After he accepts, he "is immediately Bishop of the Church of
        Rome, true Pope" (Universi Dominici Gregis 88).

  - heading: Pope Francis, 2013
    quote:
      lead: The Vatican biography tells how Francis was chosen.
      text: >-
        on 13 March 2013, at the age of 76, Cardinal Bergoglio was elected the
        266th Pope of the Catholic Church by the Cardinals gathered in
        Conclave
      source: fran-bio
      cite: Vatican biography of Pope Francis
      highlight: elected the 266th Pope
    text: >-
      Benedict XVI had resigned, so the cardinals met in conclave. They chose
      Jorge Mario Bergoglio, an Argentine Jesuit and the first pope from the
      Americas. He took the name Francis after Saint Francis of Assisi. He
      served twelve years and died on Easter Monday, April 21, 2025, at the
      age of 88, which began the process that led to the next conclave.
    visuals:
      - type: image
        src: images/wikimedia-2019-pope-francis-visit-saint-louis-hosp-84224544.jpg
        aspect: 1.5
        credit: Tris T7 · Wikimedia Commons · CC BY-SA 4.0
      - type: timeline
        items:
          - year: February 28, 2013
            label: Benedict XVI resigns
          - year: March 13, 2013
            label: Pope Francis dies
      - type: image
        src: images/wikimedia-san-francisco-de-as-s-juan-mart-nez-mont-89817790.jpg
        aspect: 0.745
        credit: Jl FilpoC · Wikimedia Commons · CC BY-SA 4.0
        with: side
    quiz:
      type: choice
      question: What name did Cardinal Bergoglio choose?
      options: [Francis, Leo, Peter]
      answer: 0
      why: >-
        The Vatican biography: "He took the name Francis in imitation of the
        Saint of Assisi."

  - heading: Pope Leo XIV, 2025
    quote:
      lead: The Vatican biography of the newest pope says it plainly.
      text: >-
        In the Conclave which began on 7 May 2025, Cardinal Prevost was elected
        Supreme Pontiff on 8 May 2025 and chose the name Leo XIV
      source: leo-bio
      cite: Vatican biography of Pope Leo XIV
      highlight: chose the name Leo XIV
    text: >-
      Robert Francis Prevost was born in Chicago in 1955. He is an Augustinian,
      the first pope from the United States and the first Augustinian pope.
      Pope Francis made him Bishop of Chiclayo in Peru in 2015 and a cardinal
      in 2023. His first words were "Peace be with you all!" and he thanked
      Pope Francis.
    visuals:
      - type: timeline
        items:
          - year: "1955"
            label: Born in Chicago
          - year: May 7, 2025
            label: Conclave begins
          - year: May 8, 2025
            label: Leo XIV elected
          - year: May 18, 2025
            label: Inauguration Mass
      - type: image
        src: images/mine-34dbff-96cdf29c74e843669e4eb1b0ff1b9b07--mvsm1p7z.jpg
        aspect: 0.795
        caption: "source: https://www.beafriar.org/about-the-augustinians"
        with: over
      - type: image
        src: images/wikimedia-city-lights-of-the-united-states-2012-23047894.jpg
        aspect: 1.5
        credit: NASA Earth Observatory · Wikimedia Commons · Public domain
        with: over
      - type: image
        src: images/wikimedia-pope-leo-xiv-on-the-loggia-cropped-164968336.jpg
        aspect: 1.422
        credit: Edgar Beltrán / The Pillar · Wikimedia Commons · CC BY-SA 4.0
        with: over
    quiz:
      type: choice
      question: Which of these is true of Pope Leo XIV?
      options:
        - He is the first pope from the United States
        - He was born in Rome
        - He is a Jesuit
      answer: 0
      why: >-
        The Vatican biography: he is "the first Pope from the United States of
        America, and the first Augustinian Pope."

outro:
  text: >-
    So, how is a new Pope elected? The cardinals gather together at the
    Vatican after the death or resignation of the previous Pope. The cardinals
    under eighty all cast their vote in secret. The winning cardinal must
    receive two-thirds of the votes to be named as a successor of Saint Peter.
    That was Pope Francis in 2013 and Pope Leo XIV last year. Thanks for
    learning with us. I've been your host, Shalone, and until next time, stay
    holy, my friends.
  notes:
    - "Recap: the cardinals vote · two thirds of the votes · accepting and choosing a name · Pope Francis, 2013 · Pope Leo XIV, 2025."
    - "Next in the course: What Infallibility Does (and Doesn't) Mean."
  scenes:
    - type: recap
