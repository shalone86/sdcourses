# Quote-anchored lesson. Draft by Claude; Shalone writes the intro and outro.
# Updated 2026-10-27: current rules (Universi Dominici Gregis) with the old rules as a comparison,
# plus Pope Francis and Pope Leo XIV.
status: reviewed
course: what-is-the-pope
number: 2
slug: how-a-pope-is-chosen
title: How a Pope Is Chosen
excerpt: >-
  How a pope is chosen today, how that compares with the early Church, and the
  last two elections: Pope Francis in 2013 and Pope Leo XIV in 2025.

