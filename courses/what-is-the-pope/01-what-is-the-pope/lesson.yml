# Lesson format (quote-anchored)
#   Each point stands on one direct quotation from a primary source. The
#   quotation is read aloud, shown on screen, and checked word for word
#   against `source` by `npm run check`. `text` is the short explanation.
#   intro/outro are written by Shalone.
status: reviewed            # draft -> reviewed (Shalone) -> published
course: what-is-the-pope
number: 1
slug: what-is-the-pope
title: What Is the Pope?
excerpt: >-
  Bishop of Rome, successor of Peter, source of unity, servant of servants:
  four answers from Scripture, the Catechism, and the Catholic Encyclopedia.

sources:
  - id: ccc
    label: Catechism of the Catholic Church, 880–883, 936–937
    url: https://www.vatican.va/archive/ENG0015/__P2A.HTM
  - id: ce-pope
    label: "Catholic Encyclopedia (1913): The Pope"
    url: https://www.newadvent.org/cathen/12260a.htm
  - id: matthew-16
    label: Matthew 16:13–19 (NABRE)
    url: https://bible.usccb.org/bible/matthew/16
  - id: luke-10
    label: Luke 10:16 (NABRE)
    url: https://bible.usccb.org/bible/luke/10
  - id: matthew-28
    label: Matthew 28:20 (NABRE)
    url: https://bible.usccb.org/bible/matthew/28
  - id: ccc-1548
    label: Catechism of the Catholic Church, 1548
    url: https://www.vatican.va/archive/ENG0015/__P4T.HTM
  - id: wikipedia-pope
    label: "Wikipedia: Pope"
    url: https://en.wikipedia.org/wiki/Pope
    reference: true      # background only; never counts for a quotation

intro:
  text: >-
    Why is the Bishop of Rome important? What's a successor? And why would
    Christ need a representative on earth? Can't He do the job Himself? We
    will explore exactly what the Pope claims to be based on Catholic doctrine
    straight from Scripture and the Catechism. I'm your host, Shalone Cason.
    Let's begin in the name of the Father and of the Son and of the Holy
    Spirit.
  notes:                 # facts from the sources you can draw on
    - '"Pope" comes from Latin papa, from Greek pappas, "father" (Catholic Encyclopedia).'
    - Early on, many bishops were called papa; in the East it was even used for priests.
    - Pope St. Gregory VII (1073–1085) restricted the title to Peter's successors.
    - This lesson answers the question in five points; each builds on the last.
  scenes:                # `at:` starts a scene when that phrase is spoken
    - type: title
    - type: host         # photo and name from site.yml
      at: I'm your host
    - type: trinity      # triangle (Father), cross (Son), dove (Holy Spirit)
      at: in the name of the Father
      cues: {son: the Son, spirit: the Holy Spirit}

points:
  - heading: He is the Bishop of Rome
    quote:
      lead: The Catholic Encyclopedia puts it plainly.
      text: >-
        The title pope … is at present employed solely to denote the Bishop
        of Rome
      source: ce-pope
      cite: Catholic Encyclopedia, "The Pope"
      highlight: the Bishop of Rome
    text: >-
      Before he is anything else, the Pope is a bishop, elected to lead one
      diocese. Everything else flows from that. It's why his cathedral is not
      St. Peter's Basilica, as many people assume, but St. John Lateran,
      called the mother and head of all churches. A bishop's office is called
      a "see," from the Latin for "seat," and Rome's is the Holy See. What
      makes this diocese unique is who first led it.
    visuals:
      - type: compare
        left: { kicker: Most famous, title: St. Peter's Basilica, note: Built over Peter's tomb }
        right: { kicker: His cathedral, title: St. John Lateran, note: Mother and head of all churches }
        emphasis: right
    quiz:
      type: choice
      question: Which church is the Pope's cathedral?
      options: [St. Peter's Basilica, The Archbasilica of St. John Lateran, The Sistine Chapel]
      answer: 1
      why: >-
        The Pope is first of all Bishop of Rome, and Rome's cathedral is
        St. John Lateran. St. Peter's is the great basilica built over Peter's
        tomb.

  - heading: He is the successor of St. Peter
    quote:
      lead: In Matthew's Gospel, Jesus says to Simon,
      text: >-
        And so I say to you, you are Peter, and upon this rock I will build
        my church, and the gates of the netherworld shall not prevail against
        it.
      source: matthew-16
      cite: Matthew 16:18
      scene: keys
    text: >-
      In the next verse, Jesus promises Peter the keys to the kingdom of
      heaven. Peter later led the Church in Rome and died there as a martyr,
      and the bishops of Rome have succeeded him ever since. The Catechism
      teaches that his office belongs to the Church's very foundation and
      continues in those successors. Pope Leo XIV, elected in May of 2025, is
      counted as the 267th pope.
    visuals:
      - type: timeline
        items:
          - { year: "c. 64", label: St. Peter martyred in Rome }
          - { year: "c. 90", label: St. Clement writes to Corinth }
          - { year: "590", label: St. Gregory the Great }
          - { year: "1073", label: St. Gregory VII }
          - { year: "2025", label: Leo XIV elected }
        counter: { to: 267, label: popes, from Peter to Leo XIV }
    quiz:
      type: blank
      question: '"You are Peter, and upon this ____ I will build my church."'
      accept: [rock]
      why: >-
        Matthew 16:18. "Peter" comes from the word for rock. Jesus names
        Simon the rock on which he will build his Church.

  - heading: He is the visible source of unity
    quote:
      lead: The Catechism explains why the Church has a pope at all.
      text: >-
        The Pope, Bishop of Rome and Peter's successor, "is the perpetual and
        visible source and foundation of the unity both of the bishops and of
        the whole company of the faithful."
      source: ccc
      cite: Catechism 882
      highlight: visible source and foundation of the unity
    text: >-
      Just as Christ placed Peter at the head of the Twelve, the Pope heads
      the college of bishops. The bishops are not his branch managers. Each
      one is a true successor of the apostles. But together they act as one
      body only in union with their head. More than a billion Catholics, in
      thousands of dioceses, are one Church because they are in communion with
      the Pope.
    visuals:
      - type: college
        center: Peter
        ring: The Twelve
        centerAfter: The Pope
        ringAfter: The bishops
        caption: One college, one head
    quiz:
      type: truefalse
      question: The bishops are the Pope's local managers, acting on his behalf.
      answer: false
      why: >-
        False. Each bishop is a true successor of the apostles. Together they
        form one college, which acts as one only in union with Peter's
        successor (CCC 880, 883).

  - heading: Why Christ works through him
    quote:
      lead: >-
        So why does Christ work through the Pope? Jesus answers this himself
        when he sends out his disciples.
      text: >-
        Whoever listens to you listens to me. Whoever rejects you rejects me.
        And whoever rejects me rejects the one who sent me.
      source: luke-10
      cite: Luke 10:16
      highlight: listens to me
    text: >-
      So Christ chooses to lead the Church through the people he sends. This
      is right here in the Gospel of Luke. And after the Resurrection he
      promises the apostles, "I am with you always, until the end of the age."
      The Catechism says that in the ordained ministry "it is Christ himself
      who is present to his Church as Head of his Body." The Pope doesn't
      stand in for an absent Christ. No, like every bishop and priest, he is a
      visible sign of the One who is still the Church's head.
    visuals:
      - type: chain
        items: [Christ, The Apostles, Their successors, The Pope today, You]
        caption: Christ, working through those he sends
    quiz:
      type: blank
      question: '"Whoever listens to you listens to ____."'
      accept: [me]
      why: >-
        Luke 10:16. Christ works through those he sends, so hearing them is
        hearing him. The Catechism says it is "Christ himself who is present
        to his Church" in the ordained ministry (CCC 1548).

  - heading: He is the Vicar of Christ, who serves
    quote:
      lead: >-
        The Pope is the Vicar of Christ, who serves. The Catechism gives the
        Pope a striking title.
      text: >-
        For the Roman Pontiff, by reason of his office as Vicar of Christ, and
        as pastor of the entire Church has full, supreme, and universal power
        over the whole Church
      source: ccc
      cite: Catechism 882
      highlight: Vicar of Christ
    text: >-
      A vicar is one who stands in another's place. It is an immense title,
      and the Church pairs it with a humble one. Pope St. Gregory the Great
      called himself the "servant of the servants of God," and papal bulls
      still open with that title. The Pope's authority exists to guard the
      faith handed down from the apostles, not to invent a new one. He is a
      steward, not an owner.
    visuals:
      - type: term
        term: vicar
        origin: Latin vicarius
        meaning: one who stands in another's place
      - type: titles
        items:
          - { latin: Vicarius Christi, english: Vicar of Christ }
          - { latin: Servus servorum Dei, english: Servant of the servants of God }
    quiz:
      type: choice
      question: What is the purpose of the Pope's authority?
      options:
        - To create new doctrines
        - To guard and hand on the faith received from the apostles
        - To govern the city of Rome
      answer: 1
      why: >-
        His authority is "full, supreme, and universal" (CCC 882), but it is a
        stewardship. The Pope serves the faith handed down; he doesn't own it.

outro:
  text: >-
    And that was an intro to the Pope in a nutshell. He's the Bishop of Rome,
    he's the successor of Saint Peter, and he is the visible source of unity
    for the faithful. I hope you learned something new. I've been your host,
    Shalone Cason, and until next time, stay holy, my friends.
  notes:
    - "Recap: Bishop of Rome · successor of Peter · visible source of unity · Vicar of Christ who serves."
    - "Coming next in the series: How a Pope Is Chosen; What Infallibility Does (and Doesn't) Mean; Why Vatican City Exists."
  scenes:
    - type: recap
