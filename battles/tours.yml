# Battle of Tours, October 732 (BATTLES.md). Stand-in drawings: replace them by drawing the same names.
# Positions are cells; a unit's spot is its bottom-left cell. Times are seconds.
# What the sources agree on: Frankish infantry under Charles Martel met an Umayyad army (mostly
# cavalry) under Abd al-Rahman al-Ghafiqi; the Franks held; Abd al-Rahman was killed; the Umayyads
# withdrew. The exact site (near Tours and Poitiers) and any raid on their camp are uncertain.
