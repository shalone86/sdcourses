<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lesson Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%237A1F2B'/%3E%3Crect x='12' y='6' width='8' height='14' rx='4' fill='%23FBF8F2'/%3E%3Cpath d='M9 15a7 7 0 0 0 14 0M16 22v4' stroke='%23FBF8F2' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* Served by studio/server.mjs (npm start). Same identity as the lesson videos (video/theme.ts). */
@font-face{font-family:'EB Garamond';src:url(/fonts/EBGaramond.woff2) format('woff2');font-weight:400 600}
@font-face{font-family:'EB Garamond';src:url(/fonts/EBGaramond-Italic.woff2) format('woff2');font-style:italic;font-weight:400}
@font-face{font-family:Inter;src:url(/fonts/Inter.woff2) format('woff2');font-weight:400 600}
:root{
  --bg:#F5F0E6; --paper:#FBF8F2; --ink:#1E2740; --muted:#625F5B; --rule:#D9CFBC;
  --accent:#7A1F2B; --gold:#8E6E22; --ok:#2F6B3A; --rec:#B3261E;
  --serif:'EB Garamond',Georgia,'Times New Roman',serif;
  --sans:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141925; --paper:#1C2233; --ink:#ECE6D8; --muted:#A9A397; --rule:#353C55;
  --accent:#E0959E; --gold:#D2B262; --ok:#8BC79A; --rec:#FF8A80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141925; --paper:#1C2233; --ink:#ECE6D8; --muted:#A9A397; --rule:#353C55;
  --accent:#E0959E; --gold:#D2B262; --ok:#8BC79A; --rec:#FF8A80; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 var(--sans);padding:0 16px}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 40px}
header{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.eyebrow{font:600 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font:500 clamp(30px,6vw,42px)/1.08 var(--serif);margin:0;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:99px;border:1px solid var(--rule);color:var(--muted)}
.pill.approved{border-color:var(--ok);color:var(--ok)}
select{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;max-width:100%}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:4px;margin:8px 0 18px}
.tabs button{flex:1;font:600 15px/1 var(--sans);color:var(--muted);background:none;border:0;border-radius:7px;padding:12px 8px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
button:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{font:600 15px/1 var(--sans);border-radius:8px;padding:11px 16px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.btn.rec{background:var(--rec);border-color:var(--rec);color:#fff}
.btn.stop{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.big{padding:15px 22px;font-size:17px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:default}
.btn .dot{display:inline-block;width:.7em;height:.7em;border-radius:50%;background:currentColor;margin-right:.5em;vertical-align:-.05em}
.btn .sq{display:inline-block;width:.7em;height:.7em;background:currentColor;margin-right:.5em;vertical-align:-.05em}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card h2{font:500 24px/1.2 var(--serif);margin:0}
.stack{display:flex;flex-direction:column;gap:16px}
.muted{color:var(--muted)}
.small{font-size:14px}
.ok{color:var(--ok)}
.bad{color:var(--accent)}
.notice{border-radius:10px;padding:12px 14px;border:1px solid var(--rule);background:var(--paper);font-size:15px}
.notice.error{border-color:var(--accent)}
.notice ul{margin:6px 0 0;padding-left:1.2em}
pre{white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:10px;margin:0;max-height:16em;overflow:auto}

/* Section strip */
.strip{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.strip button{font:600 14px/1 var(--sans);color:var(--muted);background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;cursor:pointer;display:flex;align-items:center;gap:7px;min-width:44px;justify-content:center}
.strip button[aria-current="true"]{color:var(--ink);border-color:var(--ink)}
.strip .mic{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--rule)}
.strip .mic.has{background:var(--ok);border-color:var(--ok)}
.strip .unsaved{color:var(--gold)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;margin-bottom:16px}
.seg{display:inline-flex;background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:3px}
.seg button{font:600 14px/1 var(--sans);color:var(--muted);background:none;border:0;border-radius:6px;padding:9px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
.seg button[disabled]{cursor:default;opacity:.6}
details.mic{background:var(--paper);border:1px solid var(--rule);border-radius:9px;padding:8px 12px;font-size:14px;max-width:100%}
details.mic summary{cursor:pointer;font-weight:600;color:var(--muted)}
details.mic[open]{flex-basis:100%}
.micbody{display:flex;flex-direction:column;gap:10px;padding:10px 0 4px}
.meter{height:10px;border-radius:5px;background:var(--bg);border:1px solid var(--rule);overflow:hidden;min-width:120px;flex:1}
.meter i{display:block;height:100%;width:0;background:var(--ok);transition:width .06s linear}
.meter.hot i{background:var(--rec)}

/* The slide: teleprompter-sized text, editable in place */
.slide{background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:22px 22px 18px;display:flex;flex-direction:column;gap:14px}
.slide.yours{border-color:var(--gold)}
.slide .where{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font:600 13px/1.3 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.slide .where span:last-child{color:var(--muted);letter-spacing:.04em;text-transform:none;font-weight:500}
.slide h2{font:500 26px/1.2 var(--serif);margin:0;color:var(--muted)}
.slide label{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:-8px}
textarea.read{display:block;width:100%;font:clamp(23px,3.6vw,30px)/1.5 var(--serif);color:var(--ink);background:transparent;border:1px dashed transparent;border-radius:8px;padding:6px 8px;margin:0 -9px;width:calc(100% + 18px);resize:none;overflow:hidden}
textarea.read:hover{border-color:var(--rule)}
textarea.read:focus{background:var(--bg);border:1px solid var(--rule);outline:none}
textarea.read[readonly]{border-color:transparent;background:transparent}
textarea.read.lead{font-style:italic}
.quote{font:600 clamp(23px,3.6vw,30px)/1.5 var(--serif);border-left:4px solid var(--gold);padding-left:16px;margin:0}
.cite{font:500 13px/1.4 var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:-6px}
.cite b{color:var(--gold);font-weight:600}
details.notes{font-size:15px;color:var(--muted)}
details.notes summary{cursor:pointer;font-weight:600}
details.notes ul{margin:6px 0 0;padding-left:1.2em}
.savebar{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:12px}
.savebar .msg{margin-right:auto;font-size:14px;color:var(--gold);font-weight:600}
.check{font-size:15px;border-top:1px solid var(--rule);padding-top:12px}
.heard{border-top:1px solid var(--rule);padding-top:12px;display:flex;flex-direction:column;gap:10px}
.heard h3{font:600 12px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.said{font:19px/1.6 var(--serif)}
.said .add{color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:3px;padding:0 2px}
.said .del{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
.heard .warn{color:var(--accent);font-weight:600;font-size:15px}
.check ul{margin:6px 0 0;padding-left:1.2em}

/* Recording dock */
.dock{position:sticky;bottom:0;z-index:3;background:var(--bg);padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-top:14px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--rule)}
.dock .center{flex:1;display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;min-width:0}
.dock .time{font:600 16px/1 var(--sans);font-variant-numeric:tabular-nums;min-width:3.4em;text-align:center}
.dock .live{color:var(--rec);display:flex;align-items:center;gap:8px;font:600 14px/1 var(--sans);text-transform:uppercase;letter-spacing:.1em}
.dock .live::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--rec)}
@media (prefers-reduced-motion: no-preference){.dock .live::before{animation:blink 1.2s infinite}@keyframes blink{50%{opacity:.25}}}
.dock .meter{max-width:140px}
.dock .hint{font-size:13px;color:var(--muted);text-align:center;flex-basis:100%}
.nav{min-width:92px}
.ask textarea{width:100%;font:16px/1.5 var(--sans);color:var(--ink);background:var(--bg);border:1px solid var(--rule);border-radius:8px;padding:10px 12px;resize:vertical;min-height:4.5em}
.ask ul{margin:0;padding-left:1.2em;font-size:14px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}

/* Video tab */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--rule)}
.list li:first-child{border-top:0}
.list .name{font-weight:600}
.list .state{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
video{width:100%;border-radius:10px;background:#000;aspect-ratio:16/9}
.bar{height:8px;border-radius:4px;background:var(--bg);border:1px solid var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .4s}
.bar.indef i{width:30%!important}
@media (prefers-reduced-motion: no-preference){.bar.indef i{animation:slide 1.4s ease-in-out infinite alternate}@keyframes slide{from{margin-left:0}to{margin-left:70%}}}
a{color:var(--accent)}
@media (max-width:560px){
  .slide{padding:16px 14px 14px}
  .nav{min-width:0}
  .dock{gap:6px}
  .btn.big{padding:13px 14px;font-size:16px}
}
/* Timing tab */
.tl-top{position:sticky;top:0;z-index:4;background:var(--bg);padding-bottom:10px}
.tl-player{max-width:600px;margin:0 auto}
.tl-scene.fixed{background:var(--bg);border-style:dashed;cursor:default;color:var(--muted)}
.tl-scroll{overflow-x:auto;border:1px solid var(--rule);border-radius:10px;background:var(--paper)}
.tl{position:relative;height:250px;user-select:none;-webkit-user-select:none}
.tl-ruler{position:absolute;left:0;right:0;top:0;height:26px;border-bottom:1px solid var(--rule);cursor:pointer}
.tl-tick{position:absolute;top:14px;height:12px;border-left:1px solid var(--rule);font:500 11px/1 var(--sans);color:var(--muted);padding-left:3px}
.tl-tick.major{top:4px;height:22px;border-left-color:var(--muted)}
.tl-words{position:absolute;left:0;right:0;top:34px;height:40px}
.tl-word{position:absolute;font:13px/1 var(--serif);color:var(--ink);white-space:nowrap;cursor:pointer;padding:2px 3px;border-left:1px solid var(--gold)}
.tl-word:hover{background:var(--bg)}
.tl-scenes{position:absolute;left:0;right:0;top:90px;height:50px}
.tl-scene{position:absolute;top:0;height:46px;border-radius:8px;background:color-mix(in srgb,var(--gold) 22%,var(--paper));border:1px solid var(--gold);cursor:grab;overflow:hidden;font:600 13px/1.2 var(--sans);padding:6px 8px;color:var(--ink);touch-action:none}
.tl-scene:not(.fixed):nth-child(even){background:color-mix(in srgb,var(--accent) 14%,var(--paper));border-color:var(--accent)}
.tl-scene.moved{box-shadow:0 0 0 2px var(--ok) inset}
.tl-cues{position:absolute;left:0;right:0;top:152px;height:90px}
.tl-cue{position:absolute;top:0;transform:translateX(-7px);cursor:grab;touch-action:none;display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.tl-cue i{width:14px;height:14px;background:var(--accent);transform:rotate(45deg);border-radius:2px}
.tl-cue.moved i{background:var(--ok)}
.tl-cue span{font:600 12px/1.1 var(--sans);color:var(--ink);white-space:nowrap;background:var(--paper);padding:1px 3px;border-radius:4px;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.tl-cue:nth-child(even){top:44px}
.tl-head{position:absolute;top:0;bottom:0;width:2px;background:var(--rec);pointer-events:none;left:20px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Lesson Studio</div>
    <h1 id="title">Loading…</h1>
    <div class="meta"><span id="status"></span><select id="pick" hidden aria-label="Choose a lesson"></select></div>
  </header>
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-script" aria-selected="true">Script &amp; recording</button>
    <button role="tab" id="tab-timing" aria-selected="false">Timing</button>
    <button role="tab" id="tab-video" aria-selected="false">Video &amp; Ghost</button>
  </div>
  <main id="view"></main>
</div>

<script src="/player.js"></script>
<script src="/timing.js"></script>
<script>
'use strict';
const S = {
  lessons: [], id: null, L: null, tab: 'script', slide: 0,
  drafts: {},            // section key -> {lead?, text?} not yet saved
  saving: null, checks: {}, // section key -> result of the last save
  mode: 'each',          // 'each' slide on its own, or one 'take'
  stream: null, deviceId: '', devices: [], level: 0, peak: 0, micError: null,
  rec: null, busy: null, failed: null, notice: null,
  job: null, pollT: null, wake: null, player: new Audio(), playing: null,
};
const view = document.getElementById('view');
const enc = encodeURIComponent;
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('studio.' + k)); } catch { return null; } },
  set(k, v) { try { localStorage.setItem('studio.' + k, JSON.stringify(v)); } catch {} },
};

function el(tag, attrs, kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'text') e.textContent = v;
    else if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const c of [].concat(kids || [])) if (c !== null && c !== undefined && c !== false) e.append(c);
  return e;
}

function api(path, opts = {}) {
  return fetch(path, {method: opts.method || 'GET', headers: {'X-Studio': '1', ...(opts.headers || {})}, body: opts.body})
    .then((r) => r.json().catch(() => ({})).then((j) => { if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status); return j; }));
}
const post = (path, data) => api(path, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data || {})});

const fmt = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const wordCount = (t) => (t || '').trim().split(/\s+/).filter(Boolean).length;
const sectionName = (s) => s.kind === 'intro' ? 'Intro' : s.kind === 'outro' ? 'Outro' : 'Point ' + s.index;
const sections = () => (S.L ? S.L.sections : []);
const sec = () => sections()[S.slide];
const value = (s, field) => (S.drafts[s.key] && typeof S.drafts[s.key][field] === 'string') ? S.drafts[s.key][field] : (s[field] || '');
const spokenWords = (s) => s.kind === 'point' ? wordCount(value(s, 'lead')) + wordCount(s.quote) + wordCount(value(s, 'text')) : wordCount(value(s, 'text'));
const hasDrafts = () => Object.keys(S.drafts).length > 0;

// ---------- loading ----------

async function boot() {
  try {
    S.lessons = await api('/api/lessons');
  } catch (e) {
    view.replaceChildren(el('div', {class: 'notice error', text: 'The studio server isn’t answering. Start it again with npm start (or ask Claude).'}));
    return;
  }
  if (!S.lessons.length) { document.getElementById('title').textContent = 'No lessons yet'; view.replaceChildren(el('div', {class: 'notice', text: 'Ask Claude to start a lesson; it shows up here.'})); return; }
  const last = store.get('last');
  const id = last && S.lessons.some((l) => l.id === last.id) ? last.id : S.lessons[S.lessons.length - 1].id;
  await openLesson(id, last && last.id === id ? last.slide : 0);
  poll();
}

async function openLesson(id, slide) {
  try {
    const L = await api('/api/lesson?id=' + enc(id));
    S.id = id; S.L = L; S.slide = Math.min(slide || 0, L.sections.length - 1); S.drafts = {}; S.checks = {}; S.notice = null;
  } catch (e) {
    S.id = id; S.L = null; S.notice = {error: true, text: 'This lesson can’t be opened: ' + e.message};
  }
  remember();
  render();
}

async function refresh() {
  if (!S.id) return;
  try { S.L = await api('/api/lesson?id=' + enc(S.id)); } catch {}
}

function remember() { store.set('last', {id: S.id, slide: S.slide}); }

// ---------- header and tabs ----------

function renderHeader() {
  const L = S.L;
  document.getElementById('eyebrow').textContent = L ? L.course + ' · Lesson ' + L.number : 'Lesson Studio';
  document.getElementById('title').textContent = L ? L.title : 'Lesson Studio';
  document.title = L ? L.title + ' · Lesson Studio' : 'Lesson Studio';
  const st = document.getElementById('status');
  st.replaceChildren(L ? el('span', {class: 'pill' + (L.status === 'reviewed' ? ' approved' : ''), text: L.status === 'reviewed' ? 'Approved' : L.status === 'published' ? 'Published' : 'Draft'}) : '');
  const pick = document.getElementById('pick');
  pick.hidden = S.lessons.length < 2;
  pick.replaceChildren(...S.lessons.map((l) => el('option', {value: l.id, selected: l.id === S.id, text: l.course + ' ' + l.number + ': ' + l.title})));
  pick.disabled = !!(S.rec || S.busy);
  for (const t of ['script', 'timing', 'video']) {
    const b = document.getElementById('tab-' + t);
    b.setAttribute('aria-selected', S.tab === t);
    b.disabled = !!(S.rec || S.busy);
  }
}

function render() {
  renderHeader();
  const kids = [];
  if (S.notice) kids.push(noticeEl(S.notice));
  if (S.L) kids.push(S.tab === 'script' ? scriptView() : S.tab === 'timing' ? timingView() : videoView());
  view.replaceChildren(...kids);
  for (const t of view.querySelectorAll('textarea.read')) grow(t);
  watchListening();
}

function noticeEl(n) {
  return el('div', {class: 'notice' + (n.error ? ' error' : ''), role: n.error ? 'alert' : 'status'}, [
    n.text, n.list ? el('ul', {}, n.list.map((x) => el('li', {text: x}))) : null, n.extra || null,
  ]);
}

document.getElementById('tab-script').addEventListener('click', () => switchTab('script'));
document.getElementById('tab-video').addEventListener('click', () => switchTab('video'));
document.getElementById('tab-timing').addEventListener('click', () => switchTab('timing'));
document.getElementById('pick').addEventListener('change', async (e) => { await saveAll(); openLesson(e.target.value, 0); });

async function switchTab(tab) {
  if (S.tab === tab) return;
  await saveAll();
  if (S.timing && S.timing.dirty() && !confirm('You have timing changes that aren’t saved. Leave them?')) return;
  if (S.timing) S.timing.pause();
  S.tab = tab; S.notice = null;
  stopPlayback();
  if (tab === 'timing') { releaseMic(); S.timingRoot = null; }
  if (tab === 'video') { releaseMic(); await refresh(); }
  render();
}

// ---------- timing ----------

// The Timing tab lives in studio/timing.js; its root is kept so the video player isn't rebuilt on every redraw.
function timingView() {
  if (!S.timingRoot || S.timingFor !== S.id) {
    S.timingRoot = el('div', {class: 'stack'});
    S.timingFor = S.id;
    S.timing = window.TimingTab.open(S.timingRoot, S.id, api, post);
  }
  return S.timingRoot;
}

// ---------- script & recording ----------

function scriptView() {
  const s = sec();
  return el('div', {}, [
    strip(),
    el('div', {class: 'toolbar'}, [modeSwitch(), micPanel()]),
    slideEl(s),
    dock(s),
    el('div', {style: 'height:16px'}),
    askCard(),
  ]);
}

function strip() {
  return el('nav', {class: 'strip', 'aria-label': 'Sections'}, sections().map((s, i) => el('button', {
    'aria-current': i === S.slide ? 'true' : 'false', disabled: !!(S.rec || S.busy),
    title: sectionName(s) + (s.audio ? ' · recorded ' + fmt(s.audio.seconds) : ' · not recorded'),
    onclick: () => goTo(i),
  }, [s.kind === 'point' ? String(s.index) : sectionName(s), el('span', {class: 'mic' + (s.audio ? ' has' : ''), 'aria-label': s.audio ? 'recorded' : 'not recorded'}), S.drafts[s.key] ? el('span', {class: 'unsaved', text: '•', 'aria-label': 'unsaved changes'}) : null])));
}

function modeSwitch() {
  const b = (mode, label) => el('button', {'aria-pressed': S.mode === mode ? 'true' : 'false', disabled: !!(S.rec || S.busy), text: label, onclick: () => { S.mode = mode; store.set('mode', mode); render(); }});
  return el('div', {class: 'seg', role: 'group', 'aria-label': 'How to record'}, [b('each', 'One slide at a time'), b('take', 'One take')]);
}

function micPanel() {
  const select = el('select', {'aria-label': 'Microphone', disabled: !!S.rec, onchange: (e) => switchMic(e.target.value)},
    S.devices.length ? S.devices.map((d, i) => el('option', {value: d.deviceId, selected: d.deviceId === S.deviceId, text: d.label || 'Microphone ' + (i + 1)})) : [el('option', {text: 'Allow the microphone to see the list'})]);
  const d = el('details', {class: 'mic', open: store.get('micOpen') ? true : null, ontoggle: (e) => store.set('micOpen', e.target.open)}, [
    el('summary', {text: S.stream ? 'Microphone: on' : 'Microphone'}),
    el('div', {class: 'micbody'}, [
      el('div', {class: 'row'}, [select, S.stream ? el('button', {class: 'btn', text: 'Turn off', disabled: !!S.rec, onclick: () => { releaseMic(); render(); }}) : el('button', {class: 'btn', text: 'Check microphone', onclick: () => ensureMic().then(render, micFailed)})]),
      S.stream ? el('div', {class: 'row'}, [el('div', {class: 'meter', 'data-meter': ''}, el('i')), el('span', {class: 'small muted', 'data-meterhint': '', text: 'Say a few words. The bar should move.'})]) : null,
      S.micError ? el('div', {class: 'small bad', text: S.micError}) : null,
      el('div', {class: 'small muted', text: 'Tip: sit close to the microphone, in a quiet room with soft things around (curtains, a sofa). Read naturally; small slips are fine to keep.'}),
    ]),
  ]);
  return d;
}

function slideEl(s) {
  const locked = !!(S.rec || S.busy);
  const yours = s.kind !== 'point';
  const est = spokenWords(s) / 2.4;
  const kids = [el('div', {class: 'where'}, [
    el('span', {text: sectionName(s) + (yours ? ' · your words' : '')}),
    el('span', {text: spokenWords(s) + ' words · about ' + fmt(est) + (s.audio ? ' · recorded ' + fmt(s.audio.seconds) : '')}),
  ])];
  const area = (field, cls, label) => {
    const id = 'f-' + s.key + '-' + field;
    const t = el('textarea', {id, class: 'read' + (cls ? ' ' + cls : ''), rows: 1, readonly: locked, spellcheck: 'true'});
    t.value = value(s, field);
    t.addEventListener('input', () => { setDraft(s, field, t.value); grow(t); });
    kids.push(el('label', {for: id, text: label}), t);
  };
  if (s.kind === 'point') {
    kids.push(el('h2', {text: s.heading}));
    area('lead', 'lead', 'Lead-in');
    kids.push(el('blockquote', {class: 'quote', text: s.quote}), el('div', {class: 'cite'}, [s.cite + ' · ', el('b', {text: 'read exactly'})]));
    area('text', '', 'Explanation');
  } else {
    area('text', '', s.kind === 'intro' ? 'Your intro' : 'Your outro');
    if (!value(s, 'text')) kids.push(el('div', {class: 'small muted', text: 'Not written yet. Type it here, or tell Claude in chat.'}));
    if (s.notes && s.notes.length) kids.push(el('details', {class: 'notes'}, [el('summary', {text: 'Facts you can draw on'}), el('ul', {}, s.notes.map((n) => el('li', {text: n})))]));
  }
  kids.push(saveBar(s));
  const c = S.checks[s.key];
  if (c) kids.push(checkEl(c));
  if (s.audio && s.heard && !S.rec && !S.busy) kids.push(heardEl(s));
  return el('article', {class: 'slide' + (yours ? ' yours' : '')}, kids);
}

function saveBar(s) {
  const bar = el('div', {class: 'savebar', id: 'savebar', hidden: !S.drafts[s.key] && S.saving !== s.key}, [
    el('span', {class: 'msg', text: S.saving === s.key ? 'Saving and checking quotations…' : 'Unsaved changes'}),
    el('button', {class: 'btn', text: 'Undo', disabled: S.saving === s.key, onclick: () => { delete S.drafts[s.key]; delete S.checks[s.key]; render(); }}),
    el('button', {class: 'btn primary', text: 'Save', disabled: S.saving === s.key, onclick: () => saveSection(s.key)}),
  ]);
  return bar;
}

function checkEl(c) {
  if (c.error) return el('div', {class: 'check bad', role: 'alert', text: 'Couldn’t save: ' + c.error});
  const kids = [];
  if (!c.changes.length) kids.push(el('span', {class: 'muted', text: 'No changes to save.'}));
  else if (c.check && c.check.ok) kids.push(el('span', {class: 'ok', text: 'Saved. All quotations still match their sources.'}));
  else if (c.check && c.check.problems.length) kids.push(el('span', {class: 'bad', text: 'Saved, but a quotation doesn’t match its source. Ask Claude to fix it, or put your words back.'}), el('ul', {}, c.check.problems.map((p) => el('li', {text: p}))));
  else if (c.check) kids.push(el('span', {class: 'ok', text: 'Saved. '}), el('span', {class: 'muted', text: 'Some quotations couldn’t be re-checked because a source website didn’t answer. Claude will check them before the lesson goes to Ghost.'}));
  if (c.unapproved) kids.push(el('div', {class: 'small muted', text: 'The lesson was approved before; since the script changed, approve it again after making the new video.'}));
  return el('div', {class: 'check', role: 'status'}, kids);
}

// What she said vs. the script (Whisper, run by the studio after each recording).
function heardEl(s) {
  const h = s.heard;
  if (h.pending) return el('div', {class: 'heard', role: 'status'}, [el('h3', {text: 'What you said'}), el('div', {class: 'small muted', text: 'Listening back to your recording…'})]);
  const kids = [el('h3', {text: 'What you said'})];
  if (h.quote && !h.quote.ok) {
    const bits = [h.quote.missing.length ? 'missed “' + h.quote.missing.join(' ') + '”' : '', h.quote.added.length ? 'added “' + h.quote.added.join(' ') + '”' : ''].filter(Boolean).join(', ');
    kids.push(el('div', {class: 'warn', role: 'alert', text: 'The quotation was read differently (' + bits + '). Quotations must be read exactly: re-record this slide.'}));
  }
  if (!h.changed) { kids.push(el('div', {class: 'small ok', text: 'Matches the script.'})); return el('div', {class: 'heard'}, kids); }
  if (S.keepScript && S.keepScript[s.key] === s.audio.at) { kids.push(el('div', {class: 'small muted', text: 'Kept the script as written.'})); return el('div', {class: 'heard'}, kids); }
  kids.push(el('div', {class: 'said'}, h.diff.flatMap((d) => [d.kind === 'same' ? d.t : el('span', {class: d.kind === 'added' ? 'add' : 'del', text: d.t}), ' '])));
  kids.push(el('div', {class: 'small muted', text: 'Green: words you said that aren’t in the script. Struck through: script words you didn’t say. Using your words keeps the post matching the video; quotations stay exactly as written.'}));
  kids.push(el('div', {class: 'row'}, [
    el('span', {}),
    el('span', {}, [
      el('button', {class: 'btn', text: 'Keep the script', onclick: () => { (S.keepScript ||= {})[s.key] = s.audio.at; store.set('keep', S.keepScript); render(); }}),
      ' ',
      el('button', {class: 'btn primary', text: 'Use what I said', onclick: () => useSpoken(s)}),
    ]),
  ]));
  return el('div', {class: 'heard'}, kids);
}

async function useSpoken(s) {
  S.saving = s.key; render();
  try {
    const r = await post('/api/use-spoken?id=' + enc(S.id), {section: s.key});
    S.L = r.lesson; S.checks[s.key] = r;
  } catch (e) { S.checks[s.key] = {error: e.message}; }
  S.saving = null;
  render();
}

// While recordings are being listened to, check back every few seconds.
function watchListening() {
  clearTimeout(S.listenT);
  if (!S.L || !S.L.sections.some((x) => x.heard && x.heard.pending)) return;
  S.listenT = setTimeout(async () => {
    const typing = document.activeElement && document.activeElement.tagName === 'TEXTAREA';
    if (!S.rec && !S.busy && !typing && !hasDrafts()) { await refresh(); render(); } else watchListening();
  }, 3000);
}

function setDraft(s, field, v) {
  const d = S.drafts[s.key] || (S.drafts[s.key] = {});
  d[field] = v;
  // Back to the saved text: nothing to save.
  if (Object.keys(d).every((f) => d[f] === (s[f] || ''))) delete S.drafts[s.key];
  delete S.checks[s.key];
  const bar = document.getElementById('savebar');
  if (bar) bar.hidden = !S.drafts[s.key];
  const strip = view.querySelector('.strip');
  if (strip) strip.replaceWith(window.strip());
}

function grow(t) { t.style.height = 'auto'; t.style.height = t.scrollHeight + 2 + 'px'; }

async function saveSection(key) {
  const d = S.drafts[key];
  if (!d) return;
  S.saving = key; render();
  try {
    const r = await post('/api/save?id=' + enc(S.id), {section: key, ...d});
    delete S.drafts[key];
    S.L = r.lesson; S.checks[key] = r;
  } catch (e) {
    S.checks[key] = {error: e.message};
  }
  S.saving = null;
  render();
}

async function saveAll() { for (const key of Object.keys(S.drafts)) await saveSection(key); }

async function goTo(i) {
  if (i === S.slide || i < 0 || i >= sections().length) return;
  await saveAll();
  stopPlayback();
  S.slide = i; S.notice = null; remember();
  render();
  scrollTo({top: 0});
}

// ---------- the recording dock ----------

function dock(s) {
  const last = S.slide === sections().length - 1;
  const r = S.rec;
  const inTake = r && r.kind === 'take';
  const back = el('button', {class: 'btn big nav', text: '‹ Back', disabled: S.slide === 0 || !!r || !!S.busy, onclick: () => goTo(S.slide - 1)});
  let next;
  if (inTake) next = el('button', {class: 'btn big primary nav', text: last ? 'Finish ✓' : 'Next ›', onclick: takeNext});
  else next = el('button', {class: 'btn big nav', text: 'Next ›', disabled: last || !!r || !!S.busy, onclick: () => goTo(S.slide + 1)});

  const center = el('div', {class: 'center'});
  if (S.busy) center.append(el('span', {class: 'muted', role: 'status', text: S.busy}));
  else if (r && r.stopping) center.append(el('span', {class: 'muted', role: 'status', text: 'Finishing…'}));
  else if (S.failed) {
    center.append(
      el('span', {class: 'bad small', text: 'The recording didn’t save.'}),
      el('button', {class: 'btn primary', text: 'Try again', onclick: retryUpload}),
      el('a', {class: 'small', href: S.failed.url, download: S.failed.name, text: 'Keep a copy'}),
    );
  } else if (r) {
    center.append(
      el('span', {class: 'live', text: r.kind === 'take' ? 'One take' : 'Recording'}),
      el('span', {class: 'time', 'data-time': '', text: fmt((performance.now() - r.t0) / 1000)}),
      el('div', {class: 'meter', 'data-meter': ''}, el('i')),
      el('button', {class: 'btn big stop', onclick: () => stopRecording(true)}, [el('span', {class: 'sq'}), r.kind === 'take' ? 'Stop take' : 'Stop']),
    );
    if (inTake) center.append(el('div', {class: 'hint', text: last ? 'Last section. Tap Finish when you’re done (or press the space bar).' : 'Finish the section, pause a breath, then tap Next (or press the space bar).'}));
  } else if (S.mode === 'each') {
    if (s.audio) {
      const playing = S.playing === s.key;
      center.append(
        el('button', {class: 'btn big', onclick: () => togglePlay(s)}, playing ? '❚❚ Pause' : '▶ Play ' + fmt(s.audio.seconds)),
        el('button', {class: 'btn big rec', onclick: () => startRecording('each')}, [el('span', {class: 'dot'}), 'Re-record']),
      );
    } else {
      center.append(el('button', {class: 'btn big rec', onclick: () => startRecording('each')}, [el('span', {class: 'dot'}), 'Record ' + sectionName(s)]));
    }
  } else {
    center.append(
      el('button', {class: 'btn big rec', onclick: () => startRecording('take')}, [el('span', {class: 'dot'}), S.slide === 0 ? 'Start one take' : 'One take from ' + sectionName(s)]),
      el('div', {class: 'hint', text: 'Records from this slide to the end in one go. You tap Next between sections; that’s where it’s cut.'}),
    );
    if (s.audio) center.prepend(el('button', {class: 'btn big', onclick: () => togglePlay(s)}, S.playing === s.key ? '❚❚ Pause' : '▶ Play ' + fmt(s.audio.seconds)));
  }
  return el('div', {class: 'dock'}, [back, center, next]);
}

// ---------- microphone ----------

async function ensureMic() {
  if (S.stream && S.stream.getAudioTracks().some((t) => t.readyState === 'live')) return S.stream;
  if (!navigator.mediaDevices || !window.MediaRecorder) throw new Error('This browser can’t record. Open the studio in Chrome or Safari.');
  const audio = {echoCancellation: false, noiseSuppression: true, autoGainControl: false, channelCount: 1};
  if (S.deviceId) audio.deviceId = {exact: S.deviceId};
  S.stream = await navigator.mediaDevices.getUserMedia({audio});
  S.micError = null;
  S.deviceId = S.stream.getAudioTracks()[0].getSettings().deviceId || S.deviceId;
  store.set('mic', S.deviceId);
  S.devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audioinput' && d.deviceId !== 'default');
  startMeter();
  return S.stream;
}

function micFailed(e) {
  S.micError = e && e.name === 'NotAllowedError'
    ? 'The browser isn’t allowed to use the microphone. Click the icon at the left of the address bar, allow the microphone, then try again.'
    : 'Couldn’t start the microphone: ' + (e && e.message || e);
  render();
}

function releaseMic() {
  if (S.stream) for (const t of S.stream.getTracks()) t.stop();
  S.stream = null;
  if (S.meterCtx) { S.meterCtx.close().catch(() => {}); S.meterCtx = null; }
}

async function switchMic(id) {
  S.deviceId = id; store.set('mic', id);
  releaseMic();
  try { await ensureMic(); } catch (e) { return micFailed(e); }
  render();
}

function startMeter() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const src = ctx.createMediaStreamSource(S.stream);
  const an = ctx.createAnalyser();
  an.fftSize = 1024;
  src.connect(an);
  S.meterCtx = ctx;
  const buf = new Float32Array(an.fftSize);
  let hotUntil = 0;
  const tick = () => {
    if (S.meterCtx !== ctx) return;
    an.getFloatTimeDomainData(buf);
    let sum = 0, peak = 0;
    for (const v of buf) { sum += v * v; peak = Math.max(peak, Math.abs(v)); }
    const db = 20 * Math.log10(Math.sqrt(sum / buf.length) || 1e-6);
    const pct = Math.max(0, Math.min(100, (db + 60) / 60 * 100));
    if (peak > 0.97) hotUntil = performance.now() + 1500;
    const hot = performance.now() < hotUntil;
    for (const m of document.querySelectorAll('[data-meter]')) { m.firstChild.style.width = pct + '%'; m.classList.toggle('hot', hot); }
    const hint = document.querySelector('[data-meterhint]');
    if (hint && hot) hint.textContent = 'Too loud: move back a little from the microphone.';
    requestAnimationFrame(tick);
  };
  tick();
}

// ---------- recording ----------

const recType = () => ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'].find((t) => MediaRecorder.isTypeSupported(t)) || '';

async function startRecording(kind) {
  const s = sec();
  if (kind === 'each' && s.audio && !confirm('Replace your recording of ' + sectionName(s) + '?')) return;
  if (kind === 'take') {
    const replaced = sections().slice(S.slide).filter((x) => x.audio).map(sectionName);
    if (replaced.length && !confirm('This one take replaces your recordings of ' + replaced.join(', ') + ' as you go. Start?')) return;
  }
  await saveAll();
  stopPlayback();
  let stream;
  try { stream = await ensureMic(); } catch (e) { return micFailed(e); }
  const type = recType();
  const recorder = new MediaRecorder(stream, type ? {mimeType: type, audioBitsPerSecond: 128000} : undefined);
  const r = {recorder, kind, section: s.key, start: S.slide, marks: [], chunks: [], t0: performance.now(), type: recorder.mimeType || type || 'audio/webm', save: true};
  recorder.ondataavailable = (e) => { if (e.data && e.data.size) r.chunks.push(e.data); };
  recorder.onstart = () => { r.t0 = performance.now(); };
  recorder.onstop = () => finishRecording(r);
  S.rec = r; S.notice = null;
  recorder.start(1000);
  r.clock = setInterval(() => { for (const t of document.querySelectorAll('[data-time]')) t.textContent = fmt((performance.now() - r.t0) / 1000); }, 250);
  holdScreen();
  render();
}

function takeNext() {
  const r = S.rec;
  if (!r || r.kind !== 'take' || r.stopping) return;
  if (S.slide >= sections().length - 1) return stopRecording(false);
  // Cut a little after the tap: the next section only starts once its slide is up.
  r.marks.push((performance.now() - r.t0) / 1000 + 0.35);
  S.slide++; remember();
  render();
  scrollTo({top: 0});
}

function stopRecording(asked) {
  const r = S.rec;
  if (!r) return;
  if (r.stopping) return;
  if (asked && r.kind === 'take' && S.slide < sections().length - 1) {
    if (!confirm('Stop the take here? ' + sections().slice(r.start, S.slide + 1).map(sectionName).join(', ') + ' will be saved; you can record the rest later.')) return;
  }
  // Keep listening a moment: people often tap Stop on their last syllable.
  r.stopping = true;
  render();
  setTimeout(() => r.recorder.stop(), 700);
}

function finishRecording(r) {
  clearInterval(r.clock);
  releaseScreen();
  S.rec = null;
  const blob = new Blob(r.chunks, {type: r.type});
  const ext = /mp4/.test(r.type) ? 'm4a' : 'webm';
  const url = r.kind === 'take'
    ? '/api/take?id=' + enc(S.id) + '&start=' + r.start + '&marks=' + enc(JSON.stringify(r.marks))
    : '/api/audio?id=' + enc(S.id) + '&section=' + enc(r.section);
  upload({blob, url, type: r.type, kind: r.kind, name: (r.kind === 'take' ? 'take' : r.section) + '.' + ext});
}

async function upload(u) {
  S.failed = null;
  S.busy = u.kind === 'take' ? 'Cutting your take into sections…' : 'Saving your recording…';
  render();
  try {
    const res = await api(u.url, {method: 'POST', headers: {'Content-Type': u.type}, body: u.blob});
    S.L = res.lesson;
    if (u.kind === 'take') S.notice = {text: 'Saved ' + res.sections.length + (res.sections.length === 1 ? ' section' : ' sections') + ' from your take: ' + res.sections.map((x) => sectionName(sections().find((s) => s.key === x.section)) + ' ' + fmt(x.seconds)).join(' · ') + '. Play each one to check the cuts.'};
    if (S.failed) URL.revokeObjectURL(S.failed.url);
  } catch (e) {
    S.failed = {...u, url: URL.createObjectURL(u.blob), error: e.message};
    S.notice = {error: true, text: 'The recording didn’t save: ' + e.message + '. Try again, or keep a copy and send it to Claude in chat.'};
  }
  S.busy = null;
  render();
}

function retryUpload() { const u = S.failed; if (u) upload(u); }

function togglePlay(s) {
  if (S.playing === s.key) { stopPlayback(); render(); return; }
  stopPlayback();
  S.player.src = '/audio?id=' + enc(S.id) + '&section=' + enc(s.key) + '&v=' + s.audio.at;
  S.player.onended = () => { S.playing = null; render(); };
  S.player.play().catch(() => { S.playing = null; render(); });
  S.playing = s.key;
  render();
}
function stopPlayback() { S.player.pause(); S.playing = null; }

// Keep the screen awake while recording (best effort).
function holdScreen() { try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then((w) => { S.wake = w; }, () => {}); } catch {} }
function releaseScreen() { try { if (S.wake) S.wake.release(); } catch {} S.wake = null; }

document.addEventListener('keydown', (e) => {
  if (S.rec && S.rec.kind === 'take' && (e.code === 'Space' || e.code === 'ArrowRight') && !e.repeat) { e.preventDefault(); takeNext(); }
});

// ---------- ask Claude ----------

function askCard() {
  const t = el('textarea', {id: 'ask', rows: 3, placeholder: 'e.g. Find a quote from the Church Fathers about Peter for point 2'});
  const note = el('span', {class: 'small ok', role: 'status'});
  const send = el('button', {class: 'btn', text: 'Send to Claude', onclick: async () => {
    if (!t.value.trim()) { t.focus(); return; }
    send.disabled = true;
    try {
      const r = await post('/api/ask?id=' + enc(S.id), {text: t.value});
      S.L = r.lesson;
      render();
      const n = view.querySelector('.ask [role=status]');
      if (n) n.textContent = 'Sent. Claude reads these when you next chat (you can also just say it in chat).';
    } catch (e) { note.textContent = 'Couldn’t send: ' + e.message; send.disabled = false; }
  }});
  const open = S.L.requests || [];
  return el('section', {class: 'card ask'}, [
    el('h2', {text: 'Ask Claude for a change'}),
    el('label', {for: 'ask', class: 'small muted', text: 'Quotes, points, wording, anything. Claude checks every quotation against its source.'}),
    t,
    el('div', {class: 'row'}, [note, send]),
    open.length ? el('div', {}, [el('div', {class: 'small muted', text: 'Waiting for Claude:'}), el('ul', {}, open.map((x) => el('li', {text: x})))]) : null,
  ]);
}

// ---------- video & Ghost ----------

function videoView() {
  const L = S.L;
  const secs = L.sections;
  const recorded = secs.filter((s) => s.audio);
  const voice = recorded.reduce((n, s) => n + s.audio.seconds, 0);
  const j = S.job && S.job.id === S.id ? S.job : null;

  const recCard = el('section', {class: 'card'}, [
    el('h2', {text: 'Recordings'}),
    el('div', {class: 'muted', text: recorded.length === secs.length ? 'All ' + secs.length + ' sections recorded · ' + fmt(voice) + ' of your voice.' : recorded.length + ' of ' + secs.length + ' sections recorded. The video is silent where there’s no recording.'}),
    el('ul', {class: 'list'}, secs.map((s) => el('li', {}, [
      el('span', {class: 'name', text: sectionName(s) + (s.heading ? ': ' + s.heading : '')}),
      s.audio ? el('span', {class: 'row'}, [el('span', {class: 'state', text: fmt(s.audio.seconds)}), el('button', {class: 'btn', onclick: () => togglePlay(s)}, S.playing === s.key ? '❚❚' : '▶')])
        : el('button', {class: 'btn', text: 'Record', onclick: () => { S.slide = secs.indexOf(s); switchTab('script'); }}),
    ]))),
  ]);

  const rendering = j && j.kind === 'render' && j.running;
  const vidKids = [el('h2', {text: 'Video'})];
  if (L.video && !rendering) {
    vidKids.push(
      el('video', {controls: true, preload: 'metadata', playsinline: true, src: '/video?id=' + enc(S.id) + '&v=' + L.video.at, poster: L.video.poster ? '/video?id=' + enc(S.id) + '&file=poster&v=' + L.video.at : null}),
      el('div', {class: 'muted small', text: 'lesson.mp4 · ' + (L.video.size / 1e6).toFixed(1) + ' MB · made ' + new Date(L.video.at).toLocaleString([], {dateStyle: 'medium', timeStyle: 'short'})}),
    );
    if (L.video.stale) vidKids.push(el('div', {class: 'bad', text: 'The script or a recording changed after this video was made. Make it again to include the changes.'}));
  } else if (!rendering) {
    vidKids.push(el('div', {class: 'muted', text: 'No video yet.'}));
  }
  vidKids.push(el('div', {id: 'jobpanel'}, jobPanel('render')));
  if (!rendering) vidKids.push(el('div', {class: 'row'}, [
    el('span', {class: 'small muted', text: 'Takes about 3–5 minutes.'}),
    el('button', {class: 'btn big' + (!L.video || L.video.stale ? ' primary' : ''), text: L.video ? 'Make the video again' : 'Make the video', disabled: !!(S.job && S.job.running), onclick: makeVideo}),
  ]));

  const publishing = j && j.kind === 'publish' && j.running;
  const ghostCard = el('section', {class: 'card'}, [
    el('h2', {text: 'Approve and send to Ghost'}),
    el('div', {text: 'When you’re happy with the script and the video, approve the lesson. That marks it as reviewed and saves it to Ghost as a draft, with the video, quiz and sources. Nothing goes live until you press Publish in Ghost.'}),
    L.status === 'reviewed' ? el('div', {class: 'ok', text: 'You’ve approved this lesson.'}) : null,
    el('div', {id: 'ghostpanel'}, jobPanel('publish')),
    publishing ? null : el('div', {class: 'row'}, [
      el('span', {}),
      el('button', {class: 'btn big primary', text: L.status === 'reviewed' ? 'Send to Ghost again' : 'Approve and send to Ghost', disabled: !L.video || !!(S.job && S.job.running), onclick: approve}),
    ]),
    !L.video ? el('div', {class: 'small muted', text: 'Make the video first.'}) : null,
  ]);
  return el('div', {class: 'stack'}, [recCard, el('section', {class: 'card'}, vidKids), ghostCard]);
}

function jobPanel(kind) {
  const j = S.job;
  if (!j || j.id !== S.id || j.kind !== kind) return [];
  const mins = fmt(((j.endedAt || Date.now()) - j.startedAt) / 1000);
  if (j.running) {
    const label = (j.steps ? 'Step ' + j.stepIndex + ' of ' + j.steps + ': ' : '') + j.step + (j.progress != null ? ' ' + Math.round(j.progress * 100) + '%' : '');
    return [el('div', {class: 'stack', style: 'gap:8px'}, [
      el('div', {role: 'status', text: label}),
      el('div', {class: 'bar' + (j.progress == null ? ' indef' : '')}, el('i', {style: 'width:' + Math.round((j.progress || 0) * 100) + '%'})),
      el('div', {class: 'small muted', text: mins + ' so far'}),
    ])];
  }
  if (j.ok && kind === 'publish') {
    return [el('div', {class: 'notice', role: 'status'}, [
      'Saved to Ghost as a draft. ',
      j.link ? el('a', {href: j.link, target: '_blank', rel: 'noopener', text: 'Open it in Ghost'}) : null,
      j.link ? ' to look it over and press Publish.' : null,
    ])];
  }
  if (j.ok) return [el('div', {class: 'small ok', text: 'Video made in ' + mins + '.'})];
  return [el('div', {class: 'notice error', role: 'alert'}, [friendlyError(j), el('details', {}, [el('summary', {class: 'small', text: 'Details for Claude'}), el('pre', {text: j.error || j.log})])])];
}

function friendlyError(j) {
  const e = j.error || '';
  if (/COURSES_GHOST_URL|COURSES_GHOST_ADMIN_API_KEY/.test(e)) return 'Your approval is saved, but Ghost isn’t connected yet. Ask Claude to set up the Ghost connection; you’ll type the key into a file on your Mac yourself, never into chat.';
  if (/Quotation check failed/.test(e)) return 'A quotation doesn’t match its source, so nothing was sent. Ask Claude to fix it.';
  if (/Not publishing yet/.test(e)) return 'Not sent yet: ' + e.replace(/^Not publishing yet:\s*/, '').replace(/\n\s*- /g, '; ').replace(/^- /, '');
  if (j.kind === 'render') return 'The video couldn’t be made. Tell Claude; the details below help.';
  return 'Couldn’t send it to Ghost. Tell Claude; the details below help.';
}

async function makeVideo() {
  try { S.job = await post('/api/render?id=' + enc(S.id)); }
  catch (e) { S.notice = {error: true, text: e.message}; }
  render(); poll();
}

async function approve() {
  const L = S.L;
  const warn = [];
  if (L.sections.some((s) => !s.audio)) warn.push('Some sections have no recording, so the video is silent there.');
  if (L.video && L.video.stale) warn.push('The video is older than your latest changes.');
  if (!confirm((warn.length ? warn.join(' ') + '\n\n' : '') + 'Approve “' + L.title + '” and save it to Ghost as a draft?\n\nNothing goes live until you press Publish in Ghost.')) return;
  try { S.job = await post('/api/publish?id=' + enc(S.id)); await refresh(); }
  catch (e) { S.notice = {error: true, text: e.message}; }
  render(); poll();
}

async function poll() {
  clearTimeout(S.pollT);
  let j;
  try { j = await api('/api/job'); } catch { return; }
  const wasRunning = S.job && S.job.running;
  S.job = j;
  if (j && j.running) S.pollT = setTimeout(poll, 1000);
  if (S.tab !== 'video') return;
  if (wasRunning && j && !j.running) { await refresh(); render(); return; }
  // While a job runs, update only its panel so the video player isn't interrupted.
  const panel = document.getElementById(j && j.kind === 'publish' ? 'ghostpanel' : 'jobpanel');
  if (panel && j) panel.replaceChildren(...jobPanel(j.kind));
}

window.addEventListener('beforeunload', (e) => { if (hasDrafts() || S.rec || S.busy || (S.timing && S.timing.dirty())) { e.preventDefault(); e.returnValue = ''; } });

S.mode = store.get('mode') === 'take' ? 'take' : 'each';
S.keepScript = store.get('keep') || {};
S.deviceId = store.get('mic') || '';
boot();
</script>
</body>
