# Site-wide settings used by every lesson.
author: Shalone Cason

# Shown at the end of every lesson post. {author} is filled in from above.
# Keep it true: publishing is blocked until a lesson is marked `status: reviewed`.
disclosure: >-
  Written and narrated by {author}, who chose the topic, selected the points,
  and reviewed every line. Researched and drafted with AI assistance (Claude)
  from the sources above. Every quotation is checked word for word against
  its source.

# Small line on the video's closing card.
video_credit: Narrated by {author} · Prepared with AI assistance · Sources on the lesson page

# Background music: your own CC0 tracks (methodius.media). Put the file in
# music/ and name it here; a lesson can override with its own `music:` line.
# Volume is kept very low under the voice and rises slightly in the pauses.
music:
  file: ""            # e.g. music/ambient-track.mp3
  under_voice: 0.05   # gain while you're speaking (~-26 dB)
  between: 0.16       # gain in the title and closing moments
